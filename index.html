<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="calc">
        <div class="top">
          <button>dark</button>
          <div class="display">
            <div id="previous-display"></div>
            <input type="text" id="text-box" />
          </div>
        </div>

        <div class="bottom">
          <div class="buttons">
            <button id="btn-open-paren" class="btn-highlighted">(</button>
            <button id="btn-close-paren" class="btn-highlighted">)</button>
            <button id="btn-sqrt" class="btn-highlighted">√</button>
            <button id="btn-square" class="btn-highlighted">x<sup>2</sup></button>
            <button id="btn-percent">%</button>
            <button id="btn-divide">÷</button>
            <button id="btn-multiply">x</button>
            <button id="btn-delete" class="btn-highlighted">DEL</button>
            <button id="btn-7">7</button>
            <button id="btn-8">8</button>
            <button id="btn-9">9</button>
            <button id="btn-subtract" class="btn-highlighted">-</button>
            <button id="btn-4">4</button>
            <button id="btn-5">5</button>
            <button id="btn-6">6</button>
            <button id="btn-add" class="btn-highlighted">+</button>
            <button id="btn-1">1</button>
            <button id="btn-2">2</button>
            <button id="btn-3">3</button>
            <button id="btn-equals" class="btn-highlighted">=</button>
            <button id="btn-0">0</button>
            <button id="btn-decimal">.</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
